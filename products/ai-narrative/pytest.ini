[pytest]
testpaths = backend/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short

[coverage:run]
source = backend/app
omit =
    backend/app/main.py
    backend/tests/*

[coverage:report]
show_missing = true
skip_empty = true

[coverage:html]
directory = coverage_html