[pytest]
testpaths = backend/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Custom markers
markers =
    eval: live-server evaluation tests (require running backend + LLM provider)
    slow: tests that take more than a few seconds

# Default: skip eval tests unless -m eval is explicitly passed
addopts = -v --tb=short -m "not eval"

# Make imports work from project root
pythonpath = .